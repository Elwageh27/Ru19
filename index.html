</style></head><body><header class="top"><div class="wrap"><h1>امتحان الكتكوتة الذكية 💖</h1><p>123 سؤال من الأجزاء المحددة فقط • اختاري الإجابة وشوفي التصحيح والبصمجة بعد كل سؤال</p></div></header><main class="wrap" style="padding:0 13px 40px"><div class="controls"><select id="topic"><option value="all">كل الشباتر (123 سؤال)</option><option value="asthma">Bronchial Asthma (1–28)</option><option value="heart">Heart Failure (56–80)</option><option value="ie">Infective Endocarditis (84–113)</option><option value="rf">Rheumatic Fever (114–143)</option><option value="dm">Diabetes Mellitus (181–190)</option></select><select id="mode"><option value="normal">ترتيب الأسئلة الأصلي</option><option value="shuffle">ترتيب عشوائي</option></select></div><section class="progressbox"><div class="stats"><span id="counter">السؤال 1 من 123</span><span id="score">صح 0 | غلط 0</span></div><div class="bar"><span id="bar"></span></div></section><section class="panel" id="quiz"><div class="meta"><span class="tag" id="chapter">Bronchial Asthma</span><span class="num" id="qnum">Question 1</span></div><div class="stem" id="stem"></div><div class="options" id="options"></div><div id="feedback" class="feedback"></div><div class="actions"><button class="secondary" id="skip">تخطي السؤال</button><button class="primary hidden" id="next">السؤال التالي ←</button></div></section><section class="panel finish hidden" id="finish"><h2>خلصت الاختبار! 🎉</h2><div class="score" id="finalscore"></div><p id="finaltext"></p><button class="primary" onclick="restart()">إعادة الاختبار</button></section><p class="small" style="text-align:center">الأسئلة من البنك المرسل، والبصمجات شروحات إضافية للحفظ وليست من نص البنك. راجعي المعلومة للفهم مش للحفظ فقط.</p></main><script>
const DATA=[{"id":1,"stem":"Bronchial asthma is characterized by:","options":{"A":"Permanent airway obstruction","B":"Reversible airway obstruction","C":"Restrictive lung disease","D":"Fixed airflow limitation"},"answer":"B","hint":"شوف Reversible airway obstruction → اختار Reversible؛ الربو انسداده بيرجع يتحسن."},{"id":2,"stem":"The main underlying mechanism in asthma is:","options":{"A":"Pulmonary fibrosis","B":"Airway inflammation and hyperreactivity","C":"Alveolar destruction","D":"Bronchiectasis"},"answer":"B","hint":"شوف underlying mechanism + asthma → اختار Inflammation and hyperreactivity؛ التهاب وحساسية الشعب."},{"id":3,"stem":"Which of the following is a common trigger for asthma attacks?","options":{"A":"Dust and pollen","B":"Smoking","C":"Cold air","D":"All of the above"},"answer":"D","hint":"شوف Dust + Smoking + Cold air → اختار All of the above؛ كلهم triggers."},{"id":4,"stem":"The most characteristic symptom of bronchial asthma is:","options":{"A":"Chest pain","B":"Persistent cough","C":"Wheezing","D":"Hemoptysis"},"answer":"C","hint":"شوف characteristic symptom + asthma → اختار Wheezing؛ صفير الصدر."},{"id":5,"stem":"Which immunoglobulin is most involved in allergic (extrinsic) asthma?","options":{"A":"IgA","B":"IgG","C":"IgM","D":"IgE"},"answer":"D","hint":"شوف allergic / extrinsic asthma → اختار IgE؛ الحساسية مرتبطة بـ IgE."},{"id":6,"stem":"Which of the following cells play a key role in asthma inflammation?","options":{"A":"Neutrophils","B":"Eosinophils","C":"Basophils","D":"Macrophages"},"answer":"B","hint":"شوف asthma inflammation + cells → اختار Eosinophils؛ احفظ Eos = asthma allergy."},{"id":7,"stem":"Which of the following is a short-acting beta-2 agonist (SABA)?","options":{"A":"Salmeterol","B":"Formoterol","C":"Salbutamol","D":"Tiotropium"},"answer":"C","hint":"شوف SABA / short acting → اختار Salbutamol؛ سالبوتامول إسعافي سريع."},{"id":8,"stem":"Which test is most useful to assess reversibility of airway obstruction?","options":{"A":"Chest X-ray","B":"CT scan","C":"Spirometry before and after bronchodilator","D":"ABG"},"answer":"C","hint":"شوف reversibility of obstruction → اختار Spirometry before and after bronchodilator؛ بنقارن قبل وبعد البخاخ."},{"id":9,"stem":"Nocturnal symptoms in asthma are due to:","options":{"A":"Decreased cortisol at night","B":"Increased sympathetic tone","C":"Increased bronchodilation","D":"High oxygen levels"},"answer":"A","hint":"شوف nocturnal symptoms → اختار Decreased cortisol at night؛ الكورتيزول بيقل ليلًا."},{"id":10,"stem":"Status asthmaticus is defined as:","options":{"A":"Mild intermittent asthma","B":"Asthma unresponsive to standard therapy","C":"Exercise-induced asthma","D":"Chronic bronchitis"},"answer":"B","hint":"شوف Status asthmaticus → اختار Asthma unresponsive to standard therapy؛ كلمة Status = النوبة مش بتستجيب للعلاج المعتاد."},{"id":11,"stem":"In acute asthma attack, the initial drug of choice is:","options":{"A":"Inhaled corticosteroids","B":"Oral theophylline","C":"Inhaled salbutamol","D":"Montelukast"},"answer":"C","hint":"شوف acute asthma + initial drug → اختار Inhaled salbutamol؛ النوبة تحتاج موسع شعب سريع."},{"id":12,"stem":"Which of the following drugs should not be used alone in asthma management?","options":{"A":"LABA (Long-acting beta-agonist)","B":"ICS (Inhaled corticosteroid)","C":"SABA (Short-acting beta-agonist)","D":"Leukotriene antagonist"},"answer":"A","hint":"شوف should NOT be used alone → اختار LABA؛ طويل المفعول مايتاخدش لوحده في الربو."},{"id":13,"stem":"Which leukotriene receptor antagonist is used in asthma prophylaxis?","options":{"A":"Roflumilast","B":"Montelukast","C":"Cromolyn sodium","D":"Ipratropium"},"answer":"B","hint":"شوف leukotriene receptor antagonist → اختار Montelukast؛ مونتيلوكاست يقفل مستقبلات اللوكوترين."},{"id":14,"stem":"Common side effect of inhaled corticosteroids:","options":{"A":"Oral thrush","B":"Tachycardia","C":"Hypoglycemia","D":"Tremor"},"answer":"A","hint":"شوف inhaled corticosteroids + side effect → اختار Oral thrush؛ الفطريات في الفم."},{"id":15,"stem":"Which of the following findings suggests severe asthma attack?","options":{"A":"PEFR > 80%","B":"Speech in full sentences =","C":"Silent chest and cyanosis","D":"Mild wheeze only"},"answer":"C","hint":"شوف severe attack + Silent chest → اختار Silent chest and cyanosis؛ الصدر الساكت علامة خطورة."},{"id":16,"stem":"Which type of asthma is associated with atopy?","options":{"A":"Intrinsic","B":"Extrinsic","C":"Occupational","D":"Aspirin-induced"},"answer":"B","hint":"شوف atopy → اختار Extrinsic؛ الربو التحسسي هو الخارجي."},{"id":17,"stem":"Aspirin-induced asthma involves increased production of:","options":{"A":"Histamine","B":"Leukotrienes","C":"Acetylcholine","D":"Bradykinin"},"answer":"B","hint":"شوف Aspirin-induced asthma → اختار Leukotrienes؛ الأسبرين مرتبط بزيادة اللوكوترين."},{"id":18,"stem":"Which of the following is a controller medication?","options":{"A":"Salbutamol","B":"Ipratropium","C":"Fluticasone","D":"Adrenaline"},"answer":"C","hint":"شوف controller medication → اختار Fluticasone؛ بخاخ كورتيزون للتحكم طويل المدى."},{"id":19,"stem":"Which drug can be used for acute asthma in patients intolerant to B- agonists?","options":{"A":"Theophylline","B":"Ipratropium bromide","C":"Prednisolone","D":"Montelukast"},"answer":"B","hint":"شوف intolerant to beta agonists → اختار Ipratropium bromide؛ بديل موسع شعب مضاد للكولين."},{"id":20,"stem":"Long-term management of severe persistent asthma includes:","options":{"A":"SABA alone","B":"ICS + LABA","C":"Oral antibiotics","D":"Cromolyn only"},"answer":"B","hint":"شوف long-term + severe persistent → اختار ICS + LABA؛ كنترول مزدوج."},{"id":21,"stem":"Which cytokine is most associated with eosinophilic inflammation in asthma?","options":{"A":"IL-1","B":"IL-5","C":"IL-10","D":"TNF-a"},"answer":"B","hint":"شوف eosinophilic inflammation + cytokine → اختار IL-5؛ IL-5 مرتبط بالـ eosinophils."},{"id":22,"stem":"Which of the following is a risk factor for asthma mortality?","options":{"A":"Overuse of SABA","B":"Use of ICS","C":"Mild disease","D":"High PEFR"},"answer":"A","hint":"شوف mortality risk → اختار Overuse of SABA؛ كثرة بخاخ الإسعاف إنذار."},{"id":23,"stem":"Which diagnostic feature differentiates asthma from COPD?","options":{"A":"Smoking history","B":"Reversibility of obstruction","C":"Chronic cough","D":"Dyspnea"},"answer":"B","hint":"شوف asthma vs COPD → اختار Reversibility؛ الربو أكثر قابلية للعكس."},{"id":24,"stem":"The “hygiene hypothesis” in asthma suggests:","options":{"A":"Lack of early infections increases allergy risk","B":"Pollution causes asthma","C":"Exercise triggers asthma","D":"All of the above"},"answer":"A","hint":"شوف hygiene hypothesis → اختار Lack of early infections increases allergy risk؛ قلة التعرض للميكروبات بدري."},{"id":25,"stem":"In mild intermittent asthma, symptoms occur:","options":{"C":"≤ 2 days per week"},"answer":"C","hint":"شوف mild intermittent → اختار ≤2 days per week؛ أعراض قليلة في الأسبوع."},{"id":26,"stem":"Which of the following is not a typical sign of asthma?","options":{"A":"Wheeze","B":"Cyanosis","C":"Cough","D":"Chest tightness"},"answer":"B","hint":"شوف NOT typical sign → اختار Cyanosis؛ الزرقة مش عرض روتيني للربو."},{"id":27,"stem":"Which of the following drugs inhibits mast cell degranulation?","options":{"A":"Montelukast","B":"Cromolyn sodium","C":"Salbutamol","D":"Theophylline"},"answer":"B","hint":"شوف mast cell degranulation inhibitor → اختار Cromolyn sodium؛ يثبّت mast cells."},{"id":28,"stem":"In asthma, arterial blood gases may show during severe attack:","options":{"A":"Respiratory alkalosis initially","B":"Metabolic acidosis","C":"Respiratory acidosis from the start","D":"Normal gases throughout"},"answer":"A","hint":"شوف ABG + severe asthma + initially → اختار Respiratory alkalosis initially؛ فرط التنفس يقلل CO₂ في البداية."},{"id":56,"stem":"Heart failure is defined as:","options":{"A":"Inadequate cardiac output to meet body needs","B":"High cardiac output state","C":"Sudden cardiac arrest","D":"Increased myocardial contractility"},"answer":"A","hint":"شوف heart failure defined → اختار Inadequate cardiac output to meet body needs؛ القلب مش مكفّي احتياجات الجسم."},{"id":57,"stem":"The most common cause of left-sided heart failure is:","options":{"A":"Pulmonary embolism","B":"Systemic hypertension","C":"COPD","D":"Atrial septal defect"},"answer":"B","hint":"شوف left-sided HF + common cause → اختار Systemic hypertension؛ الضغط العالي يجهد البطين الأيسر."},{"id":58,"stem":"The most common cause of right-sided heart failure is:","options":{"A":"Left-sided heart failure","B":"Pulmonary stenosis","C":"Pericarditis","D":"COPD"},"answer":"A","hint":"شوف right-sided HF + common cause → اختار Left-sided heart failure؛ الشمال يتعب فيضغط على اليمين."},{"id":59,"stem":"Which of the following best describes systolic heart failure?","options":{"A":"Impaired ventricular relaxation","B":"Reduced ejection fraction","C":"Increased stroke volume","D":"Normal contractility"},"answer":"B","hint":"شوف systolic failure → اختار Reduced ejection fraction؛ systolic = مشكلة ضخ."},{"id":60,"stem":"Diastolic heart failure is characterized by:","options":{"A":"Decreased ventricular compliance","B":"Reduced contractility","C":"Volume overload","D":"Increased cardiac output"},"answer":"A","hint":"شوف diastolic failure → اختار Decreased ventricular compliance؛ diastolic = مشكلة امتلاء/ارتخاء."},{"id":61,"stem":"The most common cause of heart failure in adults is:","options":{"A":"Coronary artery disease","B":"Valvular disease","C":"Cardiomyopathy","D":"Pulmonary hypertension"},"answer":"A","hint":"شوف HF in adults + common cause → اختار Coronary artery disease؛ الشرايين التاجية."},{"id":62,"stem":"Which of the following is NOT a typical symptom of left-sided heart failure?","options":{"A":"Dyspnea","B":"Orthopnea","C":"Paroxysmal nocturnal dyspnea","D":"Peripheral edema"},"answer":"D","hint":"شوف NOT left-sided symptom → اختار Peripheral edema؛ تورم الأطراف علامة يمين أكثر."},{"id":63,"stem":"Right-sided heart failure commonly presents with:","options":{"A":"Pulmonary congestion","B":"Peripheral edema and hepatomegaly","C":"Dyspnea on exertion","D":"Hemoptysis"},"answer":"B","hint":"شوف right-sided HF → اختار Peripheral edema and hepatomegaly؛ احتقان الجسم والكبد."},{"id":64,"stem":"The Frank-Starling law explains:","options":{"A":"Relationship between preload and stroke volume","B":"Relationship between heart rate and output","C":"Relationship between afterload and resistance","D":"Role of calcium in contraction"},"answer":"A","hint":"شوف Frank-Starling → اختار Preload and stroke volume؛ كل ما الامتلاء يزيد الضربة تتغير."},{"id":65,"stem":"Which peptide is increased in heart failure and used as a diagnostic marker?","options":{"A":"ANP","B":"BNP","C":"Renin","D":"Aldosterone"},"answer":"B","hint":"شوف diagnostic peptide in HF → اختار BNP؛ العلامة الشهيرة لفشل القلب."},{"id":66,"stem":"BNP levels are elevated because of:","options":{"A":"Increased atrial pressure","B":"Increased ventricular wall stretch","C":"Decreased renal perfusion","D":"Increased sympathetic tone"},"answer":"B","hint":"شوف BNP elevated because → اختار Ventricular wall stretch؛ جدار البطين بيتمدد."},{"id":67,"stem":"Which of the following drugs reduces mortality in chronic heart failure?","options":{"A":"Loop diuretics","B":"Digoxin","C":"ACE inhibitors","D":"Nitrates"},"answer":"C","hint":"شوف reduces mortality in chronic HF → اختار ACE inhibitors؛ مش مجرد مدرّ بول."},{"id":68,"stem":"In acute pulmonary edema, the first-line treatment is:","options":{"A":"ACE inhibitors","B":"IV furosemide and oxygen","C":"Beta-blocker","D":"Digoxin"},"answer":"B","hint":"شوف acute pulmonary edema → اختار IV furosemide and oxygen؛ مدر وريدي وأكسجين حسب البنك."},{"id":69,"stem":"Which of the following drugs is contraindicated in acute decompensated heart failure?","options":{"A":"Furosemide","B":"Beta-blocker","C":"Nitroglycerin","D":"Morphine"},"answer":"B","hint":"شوف acute decompensated HF + contraindicated → اختار Beta-blocker؛ بدءه وقت التدهور الحاد مش الاختيار."},{"id":70,"stem":"Which of the following compensatory mechanisms worsen heart failure in the long term?","options":{"A":"Sympathetic activation","B":"Increased renin-angiotensin system activity","C":"Ventricular hypertrophy","D":"All of the above"},"answer":"D","hint":"شوف sympathetic + RAAS + hypertrophy → اختار All of the above؛ التعويض المستمر يضر."},{"id":71,"stem":"Which of the following signs suggests severe left-sided heart failure?","options":{"A":"Jugular venous distension","B":"S3 gallop","C":"Hepatomegaly","D":"Ascites"},"answer":"B","hint":"شوف severe left HF → اختار S3 gallop؛ صوت ثالث مرتبط بزيادة الامتلاء."},{"id":72,"stem":"In right-sided heart failure, jugular venous pressure is:","options":{"A":"Normal","B":"Elevated","C":"Decreased","D":"Absent"},"answer":"B","hint":"شوف right HF + JVP → اختار Elevated؛ الدم بيرجع يحتقن في الأوردة."},{"id":73,"stem":"Which imaging modality is most useful for assessing ejection fraction?","options":{"A":"Chest X-ray","B":"ECG","C":"Echocardiography","D":"CT scan"},"answer":"C","hint":"شوف ejection fraction + imaging → اختار Echocardiography؛ الإيكو يقيس EF."},{"id":74,"stem":"Chest X-ray in left heart failure typically shows:","options":{"A":"Cardiomegaly and pulmonary congestion","B":"Hyperinflated lungs","C":"Pleural thickening","D":"Mediastinal shift"},"answer":"A","hint":"شوف chest X-ray + left HF → اختار Cardiomegaly and pulmonary congestion؛ قلب كبير واحتقان رئوي."},{"id":75,"stem":"The New York Heart Association (NYHA) classification is based on:","options":{"A":"Physical findings","B":"ECG changes","C":"Degree of functional limitation","D":"Laboratory tests"},"answer":"C","hint":"شوف NYHA classification → اختار Functional limitation؛ حسب تأثير الأعراض على النشاط."},{"id":76,"stem":"A patient with symptoms at rest belongs to NYHA class:","options":{"A":"|","B":"Il","C":"lll","D":"IV"},"answer":"D","hint":"شوف + ASO → اختار Both A and B؛ الاتنين دليل عدوى سترب."},{"id":130,"stem":"Pancarditis in rheumatic fever involves:","options":{"A":"Endocardium","B":"Myocardium","C":"Pericardium","D":"All of the above"},"answer":"D","hint":"شوف Pancarditis → اختار All of the above؛ Pan = كل طبقات القلب."},{"id":131,"stem":"Aschoff bodies are found in:","options":{"A":"Kidney","B":"Liver","C":"Heart","D":"Spleen"},"answer":"C","hint":"شوف Aschoff bodies + organ → اختار Heart؛ آفة روماتيزمية بالقلب."},{"id":132,"stem":"The most specific lesion of rheumatic fever is:","options":{"A":"Vegetation on valves","B":"Aschoff body","C":"Fibrinoid necrosis","D":"Chorea"},"answer":"B","hint":"شوف most specific lesion → اختار Aschoff body؛ العلامة النسيجية المميزة."},{"id":133,"stem":"Which of the following is NOT a major criterion?","options":{"A":"Carditis","B":"Polyarthritis","C":"Chorea","D":"Fever"},"answer":"D","hint":"شوف NOT major Jones → اختار Fever؛ الحمى Minor مش Major."},{"id":134,"stem":"Fever in rheumatic fever is due to:","options":{"A":"Bacterial invasion","B":"Autoimmune inflammation"},"answer":"B","hint":"شوف fever in rheumatic fever due to → اختار Autoimmune inflammation؛ مش غزو بكتيري مباشر."},{"id":135,"stem":"Mitral stenosis is a late result of:","options":{"A":"Chronic carditis","B":"Acute arthritis","C":"Chorea","D":"Nodules"},"answer":"A","hint":"شوف late mitral stenosis → اختار Chronic carditis؛ تليف مزمن بعد الالتهاب."},{"id":136,"stem":"In rheumatic carditis, murmurs are due to:","options":{"A":"Valvulitis","B":"Endocardial fibrosis","C":"Vegetations only","D":"Pericardial effusion"},"answer":"A","hint":"شوف murmur in rheumatic carditis → اختار Valvulitis؛ التهاب الصمامات يعمل لغط."},{"id":137,"stem":"Common EGG finding in acute rheumatic fever:","options":{"A":"Short PR interval","B":"Prolonged PR interval","C":"Atrial fibrillation","D":"ST elevation |"},"answer":"B","hint":"شوف ECG + rheumatic fever → اختار Prolonged PR؛ تأخر التوصيل."},{"id":138,"stem":"Which investi int":"شوف average glucose 2–3 months → اختار HbA1c؛ السكر التراكمي."},{"id":190,"stem":"Hypoglycemia is defined as blood glucose level below:","options":{"A":"180 mg/dL","B":"150 mg/dL","C":"70 mg/dL","D":"250 mg/dL"},"answer":"C","hint":"شوف Hypoglycemia below → اختار 70 mg/dL؛ رقم الهبوط 70."}];
const ranges={asthma:[1,28],heart:[56,80],ie:[84,113],rf:[114,143],dm:[181,190]};const names={asthma:'Bronchial Asthma',heart:'Heart Failure',ie:'Infective Endocarditis',rf:'Rheumatic Fever',dm:'Diabetes Mellitus'};function topicOf(id){for(const [k,[a,b]] of Object.entries(ranges))if(id>=a&&id<=b)return k;return ''}let list=[],idx=0,correct=0,wrong=0,answered=false,seen=new Set();const $=id=>document.getElementById(id);function start(){let t=$('topic').value;list=DATA.filter(q=>t==='all'||topicOf(q.id)===t);if($('mode').value==='shuffle')list=[...list].sort(()=>Math.random()-.5);idx=0;correct=0;wrong=0;seen.clear();$('finish').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){if(idx>=list.length){finish();return}answered=false;let q=list[idx];$('chapter').textContent=names[topicOf(q.id)];$('qnum').textContent='Question '+q.id;$('stem').textContent=q.stem;$('options').innerHTML='';$('feedback').className='feedback';$('feedback').innerHTML='';$('next').classList.add('hidden');$('skip').classList.remove('hidden');for(let letter of ['A','B','C','D']){if(!(letter in q.options))continue;let b=document.createElement('button');b.className='opt';b.innerHTML='<span class="letter">'+letter+'</span><span>'+escapeHtml(q.options[letter])+'</span>';b.onclick=()=>choose(letter,b);$('options').appendChild(b)}update()}function choose(letter,btn){if(answered)return;answered=true;let q=list[idx],ok=letter===q.answer;if(ok)correct++;else wrong++;seen.add(q.id);document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;let l=b.querySelector('.letter').textContent;if(l===q.answer)b.classList.add('correct');if(l===letter&&!ok)b.classList.add('wrong')});let fb=$('feedback');fb.className='feedback '+(ok?'good':'bad');let answerText=q.options[q.answer]||'';fb.innerHTML='<strong>'+(ok?'أشطر وأجمل كتكوته في الدنيا! 🥹💖👏':'أحسن علشان متزعليش حمود تاني 😂❤️')+'</strong><div dir="ltr" style="text-align:left">Correct answer: '+q.answer+'. '+escapeHtml(answerText)+'</div><div class="hint"><b>🧠 البصمجة الذكية — لما تشوفي دي اختاري دي:</b><p>'+escapeHtml(q.hint)+'</p></div>';$('next').classList.remove('hidden');$('skip').classList.add('hidden');update()}function update(){$('counter').textContent='السؤال '+Math.min(idx+1,list.length)+' من '+list.length;$('score').textContent='صح '+correct+' | غلط '+wrong;$('bar').style.width=(list.length?idx/list.length*100:0)+'%'}function next(){idx++;render()}function finish(){$('quiz').classList.add('hidden');$('finish').classList.remove('hidden');$('finalscore').textContent=correct+' / '+list.length;$('finaltext').textContent='إجابات صحيحة: '+correct+' — إجابات خاطئة: '+wrong+' — النتيجة: '+Math.round(correct/list.length*100)+'%';$('counter').textContent='انتهى الاختبار';$('bar').style.width='100%'}function restart(){start()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('next').onclick=next;$('skip').onclick=()=>{idx++;render()};$('topic').onchange=start;$('mode').onchange=start;start();
</script></body></html>
