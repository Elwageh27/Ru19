:root{--pink:#e98caf;--pink2:#f8dce8;--ink:#382d35;--muted:#887985;--bg:#fff8fb;--line:#f0dce5;--green:#21865a;--red:#c34d62}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif}
header{padding:24px 18px 18px;background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:850px;margin:auto}h1{font-size:24px;margin:0 0 6px;font-weight:750;letter-spacing:-.4px}.sub{color:var(--muted);font-size:13px}
main{max-width:850px;margin:22px auto;padding:0 16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 28px #8c52600b}
.chapters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.chapter{border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;background:#fff;cursor:pointer;color:var(--ink);transition:.15s}.chapter:hover{border-color:var(--pink);transform:translateY(-1px)}.chapter strong{display:block;font-size:15px;margin-bottom:7px}.chapter small{color:var(--muted)}
button{font:inherit}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.plain{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;color:var(--ink)}.plain:hover{border-color:var(--pink)}
.progress{height:6px;background:#f6e8ee;border-radius:10px;overflow:hidden;margin:15px 0}.bar{height:100%;width:0;background:var(--pink);transition:width .2s}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}.tag{background:#fff0f6;color:#a94e75;padding:5px 9px;border-radius:20px;font-weight:650}
h2{font-size:19px;line-height:1.5;margin:18px 0 15px}.options{display:grid;gap:9px}.option{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;text-align:left;cursor:pointer;color:var(--ink);line-height:1.45}.option:hover:not(:disabled){border-color:var(--pink);background:#fffafd}.option.correct{border-color:#72c49c;background:#edfbf3}.option.wrong{border-color:#e59aa8;background:#fff1f3}.option:disabled{cursor:default}
.feedback{margin-top:15px;padding:16px;border-radius:13px;background:#fff7fa;border:1px solid var(--line);display:none}.feedback.show{display:block}.feedback h3{margin:0 0 8px;font-size:15px}.feedback p{margin:8px 0 0;line-height:1.85;font-size:14px}.feedback .ar{direction:rtl;text-align:right;font-family:Tahoma,Arial,sans-serif}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.primary{background:var(--pink);color:#fff;border:0;border-radius:11px;padding:11px 18px;cursor:pointer;font-weight:700}.primary:disabled{opacity:.4;cursor:not-allowed}
.score{text-align:center;padding:20px}.score strong{font-size:36px;color:#b85d83}.hidden{display:none!important}

<script>
const chapters = [{"name": "Terminology and Classification", "items": [{"q": "A prosthesis is best defined as:", "o": ["A device replacing a missing body part", "A material used only for fillings", "A natural tooth covering", "A removable diagnostic tool"], "a": 0, "e": "الـ Prosthesis هو جهاز أو تعويض صناعي بيحل محل جزء مفقود من الجسم. باقي الاختيارات بتضيّق التعريف على حشو أو تغطية سن أو أداة تشخيص، وده مش تعريف الكتاب.", "d": "Easy"}, {"q": "Fixed prosthodontics deals mainly with:", "o": ["Removable appliances only", "Restoring damaged coronal portions and replacing missing teeth with permanently cemented substitutes", "Facial reconstruction only", "Orthodontic tooth movement"], "a": 1, "e": "التعريف في الكتاب بيركز على ترميم الجزء التاجي المتضرر وتعويض الأسنان المفقودة بتعويض صناعي يثبت بصورة دائمة بالإسمنت. التركيبات المتحركة وتقويم الأسنان مش المقصود هنا.", "d": "Easy"}, {"q": "Which is NOT one of the three main branches of prosthodontics?", "o": ["Removable prosthodontics", "Fixed prosthodontics", "Maxillofacial prosthetics", "Operative prosthodontics"], "a": 3, "e": "الفروع الثلاثة المذكورة هي Removable وFixed وMaxillofacial prosthetics. مصطلح Operative prosthodontics مش ضمن التقسيم الوارد في الكتاب.", "d": "Easy"}, {"q": "One aim of fixed prosthodontics is to maintain the health of the:", "o": ["TMJ", "Nasal cavity", "Middle ear", "Cervical spine"], "a": 0, "e": "الكتاب ذكر صراحة الحفاظ على صحة مفصل الفك الصدغي TMJ، بجانب استعادة المضغ والشكل والحفاظ على سلامة القوس السني.", "d": "Easy"}, {"q": "Which is an extra-coronal restoration?", "o": ["Inlay", "Onlay", "Veneer", "Pulp cap"], "a": 2, "e": "الـ Veneer بيغطي سطحاً من خارج التاج السريري، لذلك هو Extra-coronal. أما Inlay وOnlay فهما ضمن الترميمات داخل التاج Intra-coronal.", "d": "Easy"}, {"q": "An anatomical crown extends from the:", "o": ["Bottom of gingiva to incisal edge", "Incisal edge or occlusal surface to cervical line", "Root apex to CEJ", "Furcation to occlusal surface"], "a": 1, "e": "التاج التشريحي محدد بوجود المينا: من الحافة القاطعة أو السطح الإطباقي حتى الخط العنقي. أما الجزء الظاهر بالفم من قاع اللثة فهو Clinical crown.", "d": "Easy"}, {"q": "The clinical crown is the portion:", "o": ["Covered by enamel only", "Extending from the gingival margin/bottom of gingiva to incisal or occlusal surface", "Below the CEJ", "Inside the pulp chamber"], "a": 1, "e": "الـ Clinical crown هو الجزء الظاهر في الفم من مستوى اللثة حتى الحافة القاطعة أو السطح الإطباقي. مش شرط يطابق anatomical crown لأن مستوى اللثة ممكن يتغير.", "d": "Easy"}, {"q": "A bridge (FPD) replaces:", "o": ["One or more missing teeth", "Only a single cusp", "Only enamel defects", "The entire jaw"], "a": 0, "e": "الجسر Fixed Partial Denture بيعوض سناً مفقوداً أو أكثر، ويتثبت على أسنان طبيعية أو زرعات. مكوناته الأساسية Pontic وConnectors وRetainers.", "d": "Easy"}, {"q": "The three basic components of a dental bridge are:", "o": ["Post, core, crown", "Pontic, connectors, retainers", "Inlay, onlay, overlay", "Abutment, pulp, enamel"], "a": 1, "e": "المكونات الثلاثة للجسر هي Pontic وهو الجزء التعويضي للسن المفقود، وConnectors للوصل، وRetainers لتثبيت الجسر على الدعامات.", "d": "Medium"}, {"q": "A veneer is:", "o": ["A thick metal coping covering all surfaces", "A thin dental-material lamination bonded to one side of a tooth", "A post placed in the root canal", "A restoration covering the root apex"], "a": 1, "e": "الـ Veneer طبقة رقيقة من مادة سنية تُلصق على جانب واحد غالباً السطح الظاهر في الابتسامة لتحسين الشكل أو استعادة الكونتور.", "d": "Medium"}, {"q": "An inlay restores occlusal and proximal surfaces:", "o": ["Including all cusps", "Without covering the cusps", "Covering the whole clinical crown", "Only the facial surface"], "a": 1, "e": "الـ Inlay يعوض الأسطح الإطباقية والتقريبية من غير ما يغطي الحدبات. لو الترميم شمل الحدبات يبقى Onlay.", "d": "Medium"}, {"q": "An onlay differs from an inlay because it:", "o": ["Never covers occlusal surfaces", "Includes the cusps", "Is always removable", "Is always supported by an implant"], "a": 1, "e": "الـ Onlay بيشمل الحدبات بالإضافة للأسطح الإطباقية والتقريبية، وده هو الفارق الأساسي عن Inlay اللي لا يغطي الحدبات.", "d": "Medium"}, {"q": "An overlay is categorized in the book as:", "o": ["A type of crown", "A type of post", "A connector", "A temporary bridge"], "a": 0, "e": "الـ Overlay بيستخدم لما التلف يحتاج تغطية كاملة لسطح المضغ، والكتاب بيصنفه ضمن التيجان.", "d": "Medium"}, {"q": "A full-coverage restoration covers:", "o": ["Only the facial surface", "The entire coronal portion", "Only proximal surfaces", "The root canal"], "a": 1, "e": "Full coverage معناها تغطية كل الجزء التاجي، بعكس Partial coverage اللي بيغطي جزءاً فقط من التاج السريري.", "d": "Medium"}, {"q": "A complete metal cast crown is made:", "o": ["Only from ceramic", "Only from metal", "From acrylic only", "From metal and porcelain in every case"], "a": 1, "e": "الـ Full metal crown مصنوع بالكامل من معدن، وقد يكون من سبيكة noble أو base-metal. لو اتغطى بالخزف يبقى Metal-ceramic/veneered.", "d": "Medium"}, {"q": "The main advantage of a metal-ceramic crown is combining:", "o": ["Ceramic flexibility and acrylic strength", "Cast-metal strength and ceramic esthetics", "Low cost and removability", "Enamel bonding and no preparation"], "a": 1, "e": "الميزة الأساسية هي الجمع بين قوة المعدن ودقة ملاءمته وبين الشكل الجمالي للخزف. العيب المذكور هو الحاجة لإزالة كمية أكبر من السن لتوفير مساحة للمادتين.", "d": "Medium"}, {"q": "A post crown is retained by a post inserted into the:", "o": ["Pulp chamber only", "Prepared root canal", "Periodontal ligament", "Adjacent tooth"], "a": 1, "e": "الـ Post crown يعتمد على Post يدخل في قناة الجذر المحضرة، ثم يُبنى Core يعوض الجزء المفقود ويحمل التاج الخارجي.", "d": "Medium"}, {"q": "The components of a post-crown system include:", "o": ["Post, core, extra-coronal restoration", "Pontic, connector, retainer", "Blade, shank, handle", "Cusp, groove, fossa"], "a": 0, "e": "النظام يتكون من Post داخل القناة، وCore لإعادة بناء بنية السن، ثم Extra-coronal restoration مثل التاج المعدني أو الخزفي أو المركب.", "d": "Medium"}, {"q": "In a two-piece detached post system:", "o": ["Post, core and crown are one piece", "Post and core are one piece; crown is separate", "Post is separate, core and crown are one piece", "All components are fabricated separately"], "a": 1, "e": "في نظام القطعتين يتم صب الـ Post والـ Core كقطعة واحدة، ثم يُصنع التاج منفصلاً. الثلاث قطع تعني أن الـ post الجاهز والـ core والتاج كل واحد منفصل.", "d": "Hard"}, {"q": "A three-quarter crown generally does NOT cover the:", "o": ["Occlusal surface", "Mesial surface", "Facial/buccal surface", "Lingual surface"], "a": 2, "e": "الـ 3/4 crown يغطي السطح الإطباقي وثلاثة أسطح محورية، ويترك السطح الوجهي أو البَكَلي بدون تغطية. احتفظ بالنقطة دي لأنها سؤال تمييز مشهور.", "d": "Hard"}, {"q": "A reversed three-quarter crown is particularly useful for:", "o": ["Severe lingual inclination of lower posterior teeth", "Maxillary anterior discoloration", "Root canal obturation", "Replacing a single incisor with an implant"], "a": 0, "e": "الكتاب يذكر أنها مناسبة للأسنان الخلفية السفلية وخصوصاً حالات الميل اللساني الشديد، وتترك السطح اللساني غير مغطى.", "d": "Hard"}, {"q": "A seven-eighths crown is used only for:", "o": ["Mandibular canine", "Maxillary first molar", "Maxillary central incisor", "Mandibular second premolar"], "a": 1, "e": "الـ 7/8 crown يغطي كل أسطح التاج السريري ما عدا الحدبة mesiobuccal، والكتاب يذكر استخدامه فقط في الضرس الأول العلوي.", "d": "Hard"}, {"q": "A pontic is:", "o": ["The artificial coronal part replacing the missing tooth", "The natural tooth supporting the bridge", "The cement layer", "The part joining two retainers"], "a": 0, "e": "الـ Pontic هو الجزء الصناعي الذي يمثل تاج السن المفقود. الدعامة هي Abutment، والجزء الواصل هو Connector.", "d": "Hard"}, {"q": "A pier abutment is:", "o": ["The terminal abutment at one end", "An isolated or intermediate abutment with adjacent anterior and posterior teeth missing", "An implant replacing a root", "A retainer bonded to enamel"], "a": 1, "e": "الـ Pier abutment دعامة وسطية أو معزولة، والأسنان المجاورة لها من الناحيتين الأمامية والخلفية مفقودة. لا تخلط بينها وبين primary أو secondary abutment.", "d": "Hard"}, {"q": "A fixed-free (cantilever) bridge is supported:", "o": ["At both ends", "At one end only, with the other end unsupported", "By a removable attachment only", "By the pontic alone"], "a": 1, "e": "في الـ Cantilever يكون الـ Pontic مدعوماً من Retainer أو أكثر عند طرف واحد فقط، والطرف الآخر حر وغير مدعوم؛ لذلك يختلف عن fixed-fixed.", "d": "Hard"}]}, {"name": "Instruments", "items": [{"q": "A dental instrument is:", "o": ["A tool used to achieve a specific procedure", "A restorative material", "A type of impression", "A sterilization chemical"], "a": 0, "e": "الأداة السنية هي وسيلة أو جهاز يُستخدم لإنجاز عمل أو إجراء محدد. التعريف عام ولا يقتصر على أدوات القطع.", "d": "Easy"}, {"q": "Instruments are mainly classified according to use into:", "o": ["Diagnostic, cutting and restoring", "Metallic, ceramic and resin", "Short, medium and long", "Sterile, clean and dirty"], "a": 0, "e": "التقسيم الأساسي حسب الاستخدام هو Diagnostic وCutting وRestoring. أما تقسيم أدوات القطع حسب مصدر الطاقة فهو تصنيف آخر.", "d": "Easy"}, {"q": "Which is NOT listed as a cutting method?", "o": ["Hand cutting", "Rotary cutting", "Laser equipment", "Ultrasonic scaling"], "a": 3, "e": "الكتاب يذكر Hand, Rotary, Laser, Air abrasive كطرق للقطع. Ultrasonic scaling ليس ضمن القائمة المذكورة.", "d": "Easy"}, {"q": "Carbon steel instruments have:", "o": ["Low hardness and high corrosion resistance", "High hardness but reduced corrosion resistance", "No cutting ability", "Greater flexibility than all materials"], "a": 1, "e": "الكربون ستيل يتميز بصلابة عالية، لكن مقاومته للتآكل أقل. دي مقارنة مباشرة مذكورة في جزء أدوات القطع اليدوية.", "d": "Easy"}, {"q": "A hand-cutting instrument consists mainly of:", "o": ["Head, neck, shank", "Blade, shank, handle", "Tip, disc, mandrel", "Power source, motor, bur"], "a": 1, "e": "الأداة اليدوية تتكون من Blade وShank وHandle. لا تخلطها بتقسيم الأداة الدوارة إلى Shank وNeck وHead.", "d": "Easy"}, {"q": "Hand-cutting instruments may be used to remove:", "o": ["Undermined enamel and soft carious dentine", "Only old crowns", "Only calculus from implants", "Only porcelain"], "a": 0, "e": "من استخداماتها في التركيبات الثابتة إزالة المينا غير المدعومة وحفر العاج اللين المصاب بالتسوس.", "d": "Easy"}, {"q": "The rotary system is mainly composed of:", "o": ["Power source, handpiece, cutting tool", "Blade, shank, handle", "Laser, fiber, coolant", "Mirror, probe, explorer"], "a": 0, "e": "النظام الدوار يتكون من مصدر طاقة، وHandpiece ينقل الحركة، وأداة القطع نفسها. كل جزء له وظيفة مختلفة.", "d": "Easy"}, {"q": "A straight handpiece is used mainly for:", "o": ["Dental laboratory purposes", "Subgingival impression", "Measuring pulp vitality", "Taking radiographs"], "a": 0, "e": "الـ Straight handpiece يُستخدم أساساً في أعمال معمل الأسنان، بينما الـ Contra-angle له استخدامات سريرية متنوعة.", "d": "Easy"}, {"q": "Rotational speed is measured in:", "o": ["Newton", "RPM", "MPa", "Micrometers"], "a": 1, "e": "السرعة الدورانية تقاس بعدد اللفات في الدقيقة Revolutions per minute، واختصارها rpm.", "d": "Medium"}, {"q": "Low-speed instruments operate at:", "o": ["Below 12,000 rpm", "12,000–200,000 rpm", "Above 200,000 rpm", "Exactly 200,000 rpm"], "a": 0, "e": "حسب الكتاب، السرعة المنخفضة أقل من 12,000 rpm. المتوسطة من 12,000 إلى 200,000، والعالية أعلى من 200,000.", "d": "Medium"}, {"q": "Medium speed is:", "o": ["Below 12,000 rpm", "12,000 to 200,000 rpm", "Above 200,000 rpm", "Above 500,000 rpm only"], "a": 1, "e": "المدى المتوسط محدد من 12,000 إلى 200,000 rpm. راجع حدود الفئات لأن الأسئلة قد تغيّر رقم الحد فقط.", "d": "Medium"}, {"q": "Which is a use of a low-speed handpiece?", "o": ["Initial grooves and pin holes", "Rapid gross crown preparation only", "Laser debonding", "Air abrasion of enamel"], "a": 0, "e": "السرعة المنخفضة تُستخدم لبدء الأخاديد وفتحات الـ pins، وكذلك إزالة التسوس العميق والتلميع وتشطيب الترميمات.", "d": "Medium"}, {"q": "A disadvantage of low-speed cutting is that it:", "o": ["Requires heavy force and is time-consuming", "Always generates no heat", "Cuts faster than high speed", "Cannot polish restorations"], "a": 0, "e": "القطع البطيء أقل كفاءة ويستغرق وقتاً أطول ويتطلب ضغطاً أكبر، وده قد يسبب حرارة واهتزازات منخفضة التردد وعالية السعة.", "d": "Medium"}, {"q": "An advantage of high-speed cutting is:", "o": ["More pressure is required", "Less pressure, vibration and heat generation", "It is used only for polishing", "It increases operating time"], "a": 1, "e": "السرعة العالية تزيل بنية السن أسرع مع ضغط واهتزاز وحرارة أقل، وتسهّل العمل وتوفر الوقت.", "d": "Medium"}, {"q": "The shank of a rotary instrument:", "o": ["Fits into the handpiece", "Connects the head to the neck", "Performs the cutting", "Creates the finish line"], "a": 0, "e": "الـ Shank هو الجزء الذي يركب داخل الـ Handpiece ويستقبل الحركة الدورانية ويساعد على ضبط المحاذاة والاتزان.", "d": "Medium"}, {"q": "The neck of a rotary instrument:", "o": ["Performs the cutting", "Connects shank and head and transmits forces", "Fits into the handpiece", "Is the power source"], "a": 1, "e": "الـ Neck يربط الـ Shank بالـ Head وينقل القوى الدورانية والانتقالية، وتصميمه يساعد على الرؤية وحرية الحركة.", "d": "Medium"}, {"q": "The head is the basis for classifying rotary instruments because it:", "o": ["Has the greatest design variation", "Is always identical", "Contains the motor", "Fits the dental unit"], "a": 0, "e": "الـ Head هو الجزء العامل الذي يقطع أو يصقل، وتنوع أشكاله وتصميماته أكبر من بقية الأجزاء؛ لذلك التصنيف يعتمد عليه.", "d": "Medium"}, {"q": "Dental burs cut by:", "o": ["Abrasive particles", "Bladed cutting heads", "Chemical dissolution", "Ultraviolet light"], "a": 1, "e": "الـ Bur هو أداة دوارة لها رأس ذو شفرات Cutting blades. أما Diamond instruments فتعمل بالكشط Abrasion وليس بشفرات مستمرة.", "d": "Medium"}, {"q": "Diamond instruments cut by:", "o": ["Continuous blades", "Abrasive particles protruding from a matrix", "Chemical etching only", "Heat alone"], "a": 1, "e": "جزيئات الماس الصلبة تبرز من مادة حاملة ألين، والقطع يحدث عند نقاط كثيرة من هذه الجزيئات، مش على حافة شفرة واحدة.", "d": "Hard"}, {"q": "Coarse diamond particles are approximately:", "o": ["38–44 μm", "60–74 μm", "88–125 μm", "125–150 μm"], "a": 3, "e": "الـ Coarse حجمه 125–150 ميكرومتر ويستخدم للإزالة السريعة والكبيرة. الـ Fine والـ Ultra-fine للتنعيم والتشطيب.", "d": "Hard"}, {"q": "A tapered stone with a round end is used to create a:", "o": ["Shoulder finish line", "Chamfer finish line", "Knife-edge only", "Box-shaped groove"], "a": 1, "e": "الطرف المستدير للـ tapered stone يعطي Chamfer. الطرف المسطح يعطي Shoulder، والمدبب يساعد في فتح نقاط التلامس.", "d": "Hard"}, {"q": "A tapered stone with a flat end is used for:", "o": ["Chamfer", "Shoulder", "Proximal slicing", "Root planing"], "a": 1, "e": "الطرف المسطح ينتج Shoulder finish line، وهو أعرض وأكثر استهلاكاً لبنية السن من الـ Chamfer.", "d": "Hard"}, {"q": "Wheel and flame stones are used for:", "o": ["Incisal, palatal fossa and posterior occlusal reduction", "Only proximal slicing", "Only root face preparation", "Only polishing composite"], "a": 0, "e": "الكتاب يذكر استخدامهما لتقليل الحافة القاطعة للأسنان الأمامية، والحفرة الحنكية، والأسطح الإطباقية للأسنان الخلفية.", "d": "Hard"}, {"q": "Safe-sided abrasive discs have abrasive particles:", "o": ["On both sides", "On one side only to protect adjacent teeth", "Only at the center", "On the mandrel"], "a": 1, "e": "الـ Safe-sided فيه مادة كاشطة على جانب واحد لتجنب إصابة السن المجاور. الـ Double-sided له كاشط على الجانبين ويستخدم عند غياب السن المجاور.", "d": "Hard"}, {"q": "Steam autoclaving is described as:", "o": ["The most effective method for destroying pathogens", "A method that never uses heat", "A radiation method", "A method suitable only for non-critical items"], "a": 0, "e": "التعقيم بالبخار يولد حرارة رطبة تقتل الكائنات الدقيقة بسرعة، والكتاب يصفه بأنه الأكثر فاعلية لتدمير مسببات المرض.", "d": "Hard"}]}, {"name": "Principles of Tooth Preparation", "items": [{"q": "The three broad categories of tooth-preparation principles are:", "o": ["Biologic, mechanical and esthetic", "Chemical, thermal and electrical", "Diagnostic, preventive and surgical", "Anterior, posterior and proximal"], "a": 0, "e": "الكتاب يقسم المبادئ إلى بيولوجية لصحة أنسجة الفم، وميكانيكية لسلامة ومتانة الترميم، وجمالية لمظهر المريض. لازم نوازن بينهم معاً.", "d": "Easy"}, {"q": "Biologic considerations primarily affect:", "o": ["Oral tissue health", "Color matching only", "Cement strength only", "Laboratory cost"], "a": 0, "e": "الاعتبارات البيولوجية هدفها حماية اللب والأسنان المجاورة والأنسجة الرخوة وصحة اللثة على المدى الطويل.", "d": "Easy"}, {"q": "When preparing proximal surfaces, the preferred protection for the adjacent tooth is to:", "o": ["Remove all proximal enamel immediately", "Leave a slight lip/fin of enamel on the prepared tooth", "Use excessive pressure", "Ignore the adjacent tooth"], "a": 1, "e": "الكتاب يفضل تمرير أداة ماسية رفيعة وترك شريحة بسيطة من مينا السن الجاري تحضيره كحاجز يحمي السن المجاور، ثم تزال بحذر لاحقاً.", "d": "Easy"}, {"q": "Soft tissues during preparation are protected mainly by:", "o": ["Careful retraction with an aspirator tip, mirror or flanged saliva ejector", "Increasing bur speed", "Using a thicker crown", "Applying cement"], "a": 0, "e": "إبعاد اللسان والخدود بأداة شفط أو مرآة أو saliva ejector يمنع إصابتها. والحذر مهم خصوصاً عند تحضير السطح اللساني للأضراس السفلية.", "d": "Easy"}, {"q": "The main solution to heat-related pulpal injury is:", "o": ["Air-water spray directed at the bur-tooth contact", "Dry cutting with heavy pressure", "Long continuous cutting without pauses", "Removing more dentin"], "a": 0, "e": "الاحتكاك يولد حرارة، ويزيدها الضغط والسرعة وحالة الأداة. الرذاذ الهوائي المائي لازم يتوجه بدقة لمكان التلامس لتبريد السن وإزالة الرايش ومنع جفاف العاج.", "d": "Easy"}, {"q": "Chemical irritation of freshly cut dentin may be reduced by:", "o": ["Cavity varnish or dentin bonding agents", "More occlusal reduction", "A matrix band only", "A coarse disc"], "a": 0, "e": "بعض القواعد ومواد الترميم والإسمنت قد تهيج اللب عند ملامسة العاج المقطوع. الـ Varnish أو Dentin bonding يعملان حاجزاً واقياً.", "d": "Easy"}, {"q": "Bacterial pulpal irritation may result from:", "o": ["Residual caries or microleakage", "Excessive porcelain thickness only", "A smooth finish line", "Using a mirror"], "a": 0, "e": "البكتيريا قد تكون متروكة تحت الترميم أو تدخل للعاج بسبب Microleakage. لذلك يجب إزالة كل العاج المصاب قبل بناء أساس للتركيبة.", "d": "Easy"}, {"q": "The thickness of remaining dentin is inversely proportional to:", "o": ["Pulpal response", "Crown height", "Metal color", "Connector width"], "a": 0, "e": "كلما قل سمك العاج المتبقي زادت استجابة اللب وتأثره؛ لذلك التحضير العميق قرب اللب يزيد خطر التهيج أو الإصابة.", "d": "Easy"}, {"q": "Which approach conserves tooth structure?", "o": ["Prefer partial coverage when possible", "Use maximum taper", "Flatten the entire occlusal table", "Extend margins apically without reason"], "a": 0, "e": "استخدام Partial coverage عندما يكون مناسباً يحافظ على بنية السن مقارنة بالتغطية الكاملة. باقي الاختيارات تسبب إزالة غير ضرورية أو تقلل الاحتفاظ.", "d": "Medium"}, {"q": "Occlusal reduction should follow:", "o": ["Normal anatomic planes", "A completely flat plane in every case", "The gingival contour", "The root axis only"], "a": 0, "e": "اتباع المستويات التشريحية يعطي سماكة متجانسة للترميم ومسافة إطباقية كافية مع الحفاظ على السن. التسطيح قد يؤدي لنقص الخلوص أو إزالة مفرطة.", "d": "Medium"}, {"q": "Whenever possible, preparation margins should be:", "o": ["Subgingival", "Supragingival", "At the alveolar crest", "Inside the pulp"], "a": 1, "e": "الـ Supragingival أسهل في التحضير وأخذ الطبعة والتنظيف والفحص، ويقلل إصابة الأنسجة. نلجأ للـ Subgingival عند وجود سبب واضح.", "d": "Medium"}, {"q": "A major disadvantage of subgingival margins is:", "o": ["They are easier to clean", "They may contribute to periodontal disease", "They always improve impression quality", "They conserve more tooth structure"], "a": 1, "e": "امتداد الحافة تحت اللثة قد يسبب التهاباً ومشاكل دواعم السن، خصوصاً لو اقترب من epithelial attachment. لذلك لا نستخدمه لمجرد التفضيل.", "d": "Medium"}, {"q": "A finish line is:", "o": ["The area where preparation ends and the restoration margin adapts", "The occlusal contact point", "The root apex", "The cement mixing area"], "a": 0, "e": "الـ Finish line هو الحد النهائي للتحضير الذي تتكيف عليه حافة الترميم. لازم يكون واضحاً ومتصلاً ويسمح بسماكة كافية للمادة.", "d": "Medium"}, {"q": "Feather-edge margins are generally avoided because they:", "o": ["Do not provide adequate marginal bulk", "Always require excessive reduction", "Are ideal for all ceramics", "Prevent overcontouring"], "a": 0, "e": "رغم أنها محافظة على السن، إلا أنها رفيعة جداً ولا توفر سماكة كافية للمعدن؛ فيضطر الفني لزيادة حجم الترميم لتجنب تشوه الشمع، فيظهر Overcontour.", "d": "Medium"}, {"q": "A chamfer finish line is recommended for:", "o": ["Cast metal crowns and lingual part of metal-ceramic crowns", "All-ceramic facial margins only", "Acrylic temporary crowns only", "Root canal filling"], "a": 0, "e": "الـ Chamfer بسمك تقريبي 0.3–0.5 مم ويعطي حد واضح وسماكة مناسبة للمعدن، لذلك يناسب التيجان المعدنية والجزء اللساني من المعدن-الخزف.", "d": "Medium"}, {"q": "A shoulder finish line is commonly recommended for:", "o": ["All-ceramic restorations and facial part of metal-ceramic crowns", "Complete metal crowns only", "Proximal slicing", "Post space preparation"], "a": 0, "e": "الـ Shoulder بسمك 1–1.2 مم ويوفر مساحة ودعماً لمادة خزفية تحتاج سماكة أكبر. لكنه أقل محافظة على بنية السن من Chamfer.", "d": "Medium"}, {"q": "Retention form prevents removal of a restoration:", "o": ["Along its path of insertion", "By rotation only", "By fracture of cement", "Through gingival pressure"], "a": 0, "e": "الـ Retention form يقاوم خروج الترميم في نفس اتجاه مسار الإدخال أو المحور الطولي. أما Resistance form فيقاوم الإزاحة الجانبية أو الدوران.", "d": "Medium"}, {"q": "The path of insertion is:", "o": ["An imaginary line along which a restoration is placed or removed", "The path of blood flow", "The direction of occlusal wear", "The line of the gingival margin"], "a": 0, "e": "هو خط تخيلي يحدد اتجاه إدخال وإزالة الترميم. لازم يكون مناسباً حتى تجلس الحواف على الـ finish line من غير اصطدام أو Undercut.", "d": "Medium"}, {"q": "Theoretically, maximum retention is obtained with:", "o": ["Parallel walls", "Extremely divergent walls", "A feather-edge margin", "A flat occlusal surface"], "a": 0, "e": "الجدران المتوازية تعطي أعلى احتفاظ نظرياً لأنها تحد الحركة، لكن عملياً نحتاج تقارباً إطباقياً بسيطاً لتجنب الـ Undercuts والسماح بجلوس الترميم.", "d": "Hard"}, {"q": "An undercut is problematic because it:", "o": ["Prevents complete seating of the restoration", "Improves every path of insertion", "Increases porcelain translucency", "Reduces the need for cement"], "a": 0, "e": "الـ Undercut يمنع الترميم من الوصول لمكانه النهائي على مسار الإدخال. لذلك يجب كشفه وإزالته أو تعديل مسار الإدخال.", "d": "Hard"}, {"q": "Resistance form primarily prevents:", "o": ["Dislodgement by tipping or oblique forces", "Color change", "Cement setting", "Thermal expansion"], "a": 0, "e": "الـ Resistance form يقاوم القوى المائلة والجانبية التي قد تقلب أو تدور التاج، بينما retention يقاوم سحبه على مسار الإدخال.", "d": "Hard"}, {"q": "Excessive occlusal reduction may reduce resistance because it:", "o": ["Shortens the preparation", "Increases axial wall height", "Creates more enamel", "Improves groove length"], "a": 0, "e": "تقليل السطح الإطباقي أكثر من اللازم يقصر ارتفاع التحضير ويقلل كمية السن الموجودة خارج مسار الانقلاب، وبالتالي يضعف مقاومة الإزاحة.", "d": "Hard"}, {"q": "Which groove form provides high resistance to displacing forces?", "o": ["Box-shaped groove", "Shallow V-shaped groove", "No groove", "A random shallow scratch"], "a": 0, "e": "الـ Box-shaped groove يعطي مقاومة عالية، ويستخدم مع التسوس التقريبي أو بجانب Connector عند استخدام السن كـ Retainer. الـ V أقل مقاومة.", "d": "Hard"}, {"q": "The functional cusp bevel is placed to:", "o": ["Provide adequate restorative thickness in a heavily loaded area", "Reduce all cusp height to zero", "Improve only shade selection", "Create a path for impression material"], "a": 0, "e": "الـ Functional cusp bevel يوفر مساحة كافية لسماكة المعدن في منطقة التلامس الإطباقي الشديد. غيابه قد يسبب معدن رفيع أو ثقب أو ترميم زائد الكونتور مع premature contact.", "d": "Hard"}, {"q": "For anterior metal-ceramic crowns, the facial surface is prepared in two planes mainly to:", "o": ["Provide adequate reduction while preserving tooth structure and avoiding overcontour/pulp encroachment", "Make the crown removable", "Eliminate the need for porcelain", "Create a feather-edge margin"], "a": 0, "e": "التحضير في مستويين يتبع شكل السطح الوجهي: مستوى عنقي وآخر موازٍ للثلثين القاطعين. مستوى واحد قد يسبب نقص مساحة للخزف أو Overcontour أو الاقتراب من اللب.", "d": "Hard"}]}, {"name": "Complete Metal Cast Crown", "items": [{"q": "A complete metal crown restores the coronal portion in:", "o": ["Function, contour and anatomy", "Color only", "Root length only", "Pulp vitality only"], "a": 0, "e": "التاج المعدني الكامل يعيد الجزء التاجي من حيث الوظيفة والكونتور والتشريح، وليس مجرد تغيير اللون أو علاج الجذر.", "d": "Easy"}, {"q": "Which is an indication for a full metal crown?", "o": ["As a bridge retainer", "When maximum esthetics is required on an anterior tooth", "When an intact buccal wall should be preserved", "When a veneer is sufficient"], "a": 0, "e": "يمكن استخدامه كتاج منفرد أو Retainer لجسر، وكذلك في الأسنان المتهدمة أو المعالجة عصبياً أو عند الحاجة لاحتفاظ ومقاومة عاليين.", "d": "Easy"}, {"q": "A full metal crown may be indicated when:", "o": ["Maximum retention and resistance are needed in a short clinical crown", "Only a small enamel defect exists", "A conservative veneer is preferred", "The patient refuses all metal display"], "a": 0, "e": "الكتاب يذكر قصر التاج السريري مع الحاجة لأقصى Retention وResistance كأحد دواعي استخدام التاج المعدني الكامل، لأنه يشمل كل الأسطح المحورية.", "d": "Easy"}, {"q": "Which is a contraindication for a complete metal crown?", "o": ["High esthetic demand in anterior teeth", "Severe destruction by caries", "Endodontically treated tooth", "Need for a bridge retainer"], "a": 0, "e": "الشكل الجمالي الضعيف للمعدن يجعله غير مناسب عندما تكون الجمالية أولوية، خصوصاً الأسنان الأمامية. كما يُتجنب إذا كان جدار buccal أو lingual سليم ويمكن الحفاظ عليه.", "d": "Easy"}, {"q": "Compared with partial coverage, a full metal crown generally has:", "o": ["Greater retention", "Less retention", "No resistance form", "No axial coverage"], "a": 0, "e": "لأنه يشمل جميع الأسطح المحورية، يكون احتفاظه أكبر من التغطية الجزئية. لكن هذا على حساب إزالة بنية سنية أكثر.", "d": "Easy"}, {"q": "One disadvantage of a complete metal crown is that it:", "o": ["Does not allow electric pulp vitality testing", "Has no strength", "Cannot modify axial contour", "Cannot modify occlusion"], "a": 0, "e": "التاج المعدني الكامل لا يسمح بإجراء اختبار حيوية اللب الكهربائي عبر الترميم. ومن عيوبه أيضاً ضعف الجمالية وقلة المحافظة على بنية السن.", "d": "Easy"}, {"q": "High noble alloys in the book contain:", "o": ["60% noble metal and 40% gold", "25% noble metal only", "Less than 25% noble metal", "100% base metal"], "a": 0, "e": "التصنيف المذكور: High noble يحتوي 60% معدن نبيل و40% ذهب. Noble يحتوي 25% معدن نبيل دون اشتراط الذهب، وBase metal أقل من 25%.", "d": "Easy"}, {"q": "A base-metal alloy contains:", "o": ["Less than 25% noble metal", "Exactly 60% noble metal", "At least 40% gold", "No metal"], "a": 0, "e": "الـ Base-metal alloys تحتوي أقل من 25% من المعادن النبيلة، ومن أمثلتها Ni-Cr وCo-Cr وTi حسب الكتاب.", "d": "Easy"}, {"q": "The examples of base-metal alloys include:", "o": ["Ni-Cr, Co-Cr and Ti", "Au-Pt-Pd only", "Ag-Pd only", "Gold and acrylic"], "a": 0, "e": "الأمثلة المذكورة للـ Base metal هي Nickel-Chromium وCobalt-Chromium وTitanium. أما Au-Pt-Pd وAu-Ag-Pd ضمن High noble، وAg-Pd ضمن Noble.", "d": "Medium"}, {"q": "Occlusal depth cuts for non-functional and functional cusps are respectively:", "o": ["0.8 mm and 1.3 mm", "1.3 mm and 0.8 mm", "1 mm and 1 mm", "1.5 mm and 2 mm"], "a": 0, "e": "الكتاب يحدد 0.8 مم للحدبة غير الوظيفية و1.3 مم للحدبة الوظيفية. السبب إن الحدبة الوظيفية تحتاج مساحة أكبر للمعدن بسبب الحمل الأعلى.", "d": "Medium"}, {"q": "The functional cusps are:", "o": ["Buccal cusps of mandibular teeth and lingual cusps of maxillary teeth", "Lingual cusps of mandibular and buccal cusps of maxillary teeth", "All cusps are functional equally", "Only maxillary buccal cusps"], "a": 0, "e": "الحدبات الوظيفية هي Buccal في الفك السفلي وLingual/Palatal في الفك العلوي. دي قاعدة مهمة لتحديد الـ Functional cusp bevel والخلوص.", "d": "Medium"}, {"q": "The recommended occlusal clearance is at least:", "o": ["1.0 mm nonfunctional and 1.5 mm functional", "1.5 mm nonfunctional and 1.0 mm functional", "0.5 mm for both", "2.5 mm for both"], "a": 0, "e": "المسافة المطلوبة 1 مم للحدبات غير الوظيفية و1.5 مم للوظيفية. نقص المسافة قد يؤدي لترقق المعدن أو ثقبه أثناء الاستخدام أو التشطيب.", "d": "Medium"}, {"q": "The functional cusp bevel is prepared by holding the bur approximately:", "o": ["45 degrees to the long axis", "90 degrees to the long axis", "Parallel to the gingival margin", "0 degrees to the cusp slope"], "a": 0, "e": "الكتاب يوضح إمالة البور حوالي 45 درجة بالنسبة للمحور الطولي عند عمل الـ Functional cusp bevel لتوفير reduction إضافي في الحدبة الوظيفية.", "d": "Medium"}, {"q": "Occlusal reduction should follow:", "o": ["The normal occlusal anatomy", "A flat plane regardless of anatomy", "Only the central fossa", "The root long axis"], "a": 0, "e": "اتباع شكل السطح الإطباقي الطبيعي يعطي سماكة متجانسة وخلوصاً مناسباً ويحافظ على بنية السن. التسطيح الكامل قد يسبب إزالة زائدة أو clearance غير كافٍ.", "d": "Medium"}, {"q": "Which method checks occlusal clearance by asking the patient to bite on softened wax?", "o": ["Utility wax technique", "Explorer test", "Mirror survey", "Air abrasion"], "a": 0, "e": "في Utility wax المريض يعض على شمع لين في Maximum occlusion، ثم يُفحص الشمع بحثاً عن مناطق رفيعة ويمكن قياس السمك بـ Wax caliper.", "d": "Medium"}, {"q": "An occlusal reduction gauge has:", "o": ["A spherical tip on both sides with predetermined thicknesses", "A sharp blade", "A diamond abrasive surface", "A flexible impression tray"], "a": 0, "e": "الـ Reduction gauge أداة ذات طرف كروي على الجانبين وبسماكات محددة مسبقاً، وتستخدم لفحص مقدار الخلوص في مناطق مختلفة.", "d": "Medium"}, {"q": "The occlusal clearance tap is checked during:", "o": ["Maximum intercuspation, protrusive and lateral movements", "Swallowing only", "Rest position only", "Opening without contact"], "a": 0, "e": "الـ Clearance tap بسُمك معلوم، والمريض يعض عليه في Maximum intercuspation والحركات الأمامية والجانبية للتأكد من وجود الخلوص أثناء الحركات المختلفة.", "d": "Medium"}, {"q": "To free proximal contact, a fine tapered diamond is used:", "o": ["Parallel to the long axis in bucco-lingual and occluso-cervical directions", "Perpendicular to the long axis only", "At random angles", "Only on the occlusal surface"], "a": 0, "e": "الأداة الماسية الرفيعة تُمرر موازية للمحور الطولي لتحرير التلامس في الاتجاهين bucco-lingual وoccluso-cervical، مع حماية السن المجاور.", "d": "Medium"}, {"q": "A thin enamel lip may be left during proximal separation to:", "o": ["Protect the adjacent tooth from iatrogenic damage", "Increase the final crown thickness", "Create an undercut", "Replace the finish line"], "a": 0, "e": "ترك شريحة رفيعة من المينا يعمل كحاجز مؤقت يحمي السن المجاور من إصابة البور، وبعد إنهاء التخفيض تُزال بأداة يدوية بحذر.", "d": "Hard"}, {"q": "After freeing proximal contacts, the explorer should move freely in:", "o": ["Bucco-lingual and occluso-cervical directions", "Mesio-distal direction only", "A circular path only", "The root canal"], "a": 0, "e": "علامة نجاح فتح التلامس أن الـ Explorer يتحرك بحرية في الاتجاهين bucco-lingual وoccluso-cervical، وده يؤكد عدم وجود نقطة تماس متبقية تعيق التركيب.", "d": "Hard"}, {"q": "Axial depth cuts are placed on:", "o": ["Both buccal and lingual surfaces, parallel to the long axis", "Occlusal surface only", "Root apex only", "Proximal surfaces only"], "a": 0, "e": "يتم عمل ثلاثة Depth cuts على السطحين البَكَلي واللساني، وتكون موازية للمحور الطولي للسن لضبط مقدار التخفيض المحوري.", "d": "Hard"}, {"q": "The axial reduction described in the book produces a chamfer of approximately:", "o": ["0.5 mm", "1.5 mm", "2 mm", "0.1 mm"], "a": 0, "e": "باستخدام tapered stone ذي نهاية مستديرة مع ميل يقارب 6 درجات ينتج Chamfer حوالي 0.5 مم، وهو مناسب لسماكة حافة المعدن.", "d": "Hard"}, {"q": "Over-reduction during axial preparation may lead to:", "o": ["Pulp encroachment", "Thicker restoration walls", "Improved conservation", "Increased remaining dentin"], "a": 0, "e": "الإزالة الزائدة تقرّب التحضير من اللب وقد تسبب إصابته، كما تخالف المبادئ البيولوجية والميكانيكية. أما نقص الإزالة فينتج جدران ترميم رفيعة.", "d": "Hard"}, {"q": "Inadequate axial reduction may result in:", "o": ["Thin restoration walls", "Pulp protection in every case", "A wider chamfer automatically", "Greater metal bulk without contour change"], "a": 0, "e": "لو المساحة المحورية غير كافية، سيضطر المعمل لعمل جدران معدنية رفيعة أو ترميم زائد الكونتور. ده يضر القوة والشكل وصحة اللثة.", "d": "Hard"}, {"q": "The completed preparation should have:", "o": ["A smooth even chamfer, about 6-degree taper and gradual transitions", "A rough feather edge and severe undercuts", "Parallel walls with no taper", "A discontinuous finish line"], "a": 0, "e": "الشكل النهائي حسب الكتاب يتميز بحد Chamfer ناعم ومتصل، وTaper حوالي 6 درجات، وانتقالات تدريجية بين الأسطح. السطح الخشن أو الـ Undercut يمنع جلوس التاج بدقة.", "d": "Hard"}]}];
let current=0,index=0,score=0,answered=false,correctCount=0;
const $=id=>document.getElementById(id);
function show(id){["home","quiz","finish"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
chapters.forEach((c,i)=>{let b=document.createElement("button");b.className="chapter";b.innerHTML=`<strong>${i+1}. ${c.name}</strong><small>25 questions · Start practice →</small>`;b.onclick=()=>start(i);$("chapterList").appendChild(b)});
function start(i){current=i;index=0;score=0;correctCount=0;show("quiz");$("chapterName").textContent=chapters[i].name;render()}
function render(){let item=chapters[current].items[index];answered=false;$("difficulty").textContent=item.d;$("counter").textContent=`Question ${index+1} of ${chapters[current].items.length}`;$("answered").textContent=`Correct: ${correctCount}`;$("bar").style.width=(index/chapters[current].items.length*100)+"%";$("question").textContent=item.q;$("options").innerHTML="";$("feedback").classList.remove("show");$("next").disabled=true;$("next").textContent=index===24?"See results":"Next question";
item.o.forEach((op,j)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+j)+". "+op;b.onclick=()=>choose(j);$("options").appendChild(b)})}
function choose(j){if(answered)return;answered=true;let item=chapters[current].items[index];let buttons=[...$("options").children];buttons.forEach((b,k)=>{b.disabled=true;if(k===item.a)b.classList.add("correct");if(k===j&&j!==item.a)b.classList.add("wrong")});let ok=j===item.a;if(ok){score++;correctCount++}
$("result").textContent=ok?"Correct answer ✓":"Not quite — review the explanation";$("result").style.color=ok?"var(--green)":"var(--red)";$("correctAnswer").textContent="Correct answer: "+String.fromCharCode(65+item.a)+". "+item.o[item.a];$("explanation").textContent=item.e;$("feedback").classList.add("show");$("answered").textContent=`Correct: ${correctCount}`;$("next").disabled=false}
$("next").onclick=()=>{if(index<24){index++;render()}else finish()};
function finish(){show("finish");$("finishName").textContent=chapters[current].name;$("finalScore").textContent=`${score} / 25`;$("finalText").textContent=score>=20?"Excellent work. Keep revising the difficult points.":score>=14?"Good effort. Review the explanations for the questions you missed.":"Use the explanations to revise, then try the chapter again."}
$("back").onclick=$("quit").onclick=$("homeBtn").onclick=()=>show("home");$("again").onclick=()=>start(current);
</script></body></html>
